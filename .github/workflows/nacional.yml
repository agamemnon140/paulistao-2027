name: Classificações nacionais

# Disparo manual. Lê na Wikipedia em português as classificações finais das Séries A a D
# de 2021 a 2025 e commita data/nacional/. Só precisa rodar de novo se o script mudar.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Coletar e interpretar
        id: coleta
        continue-on-error: true
        run: python scripts/nacional/coletar_wikipedia.py
      - name: Commit se mudou
        run: |
          if [ -n "$(git status --porcelain data/nacional)" ]; then
            git config user.name  "coleta-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/nacional
            git commit -m "dados: classificações nacionais 2021-2025 [skip ci]"
            git push
          else
            echo "Sem mudanças."
          fi
      - name: Falhar se alguma classificação não foi lida
        if: steps.coleta.outcome == 'failure'
        run: exit 1
