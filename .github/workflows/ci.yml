name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      # O motor não tem dependências; a interface tem (React e Vite), e o teste dela monta o app.
      - run: npm ci
      - name: Assinaturas dos pacotes no registro
        run: npm audit signatures
      - name: Testes
        run: npm test
      - name: A interface compila
        run: npm run build
