name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      # Sem dependências: o motor e os testes usam só a biblioteca padrão do Node.
      - name: Paridade com o motor original e leitor da FPF
        run: npm test
